<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lumberjack — A Finnish forest adventure</title>
  <meta name="description" content="One jack. One axe. An awful lot of trees. Build a logging village, explore a Finnish forest and grow your operation in this free pixel-art strategy game.">

  <meta name="theme-color" content="#102a24">
  <meta name="color-scheme" content="dark">

  <meta property="og:site_name" content="Lumberjack">
  <meta property="og:title" content="Lumberjack — A Finnish forest adventure">
  <meta property="og:description" content="One jack. One axe. An awful lot of trees. Explore, build and automate in a free pixel-art forest strategy game.">
  <meta property="og:url" content="https://lumber-jack.koenvangilst.nl/">
  <meta property="og:locale" content="en_GB">
  <meta property="og:image" content="https://lumber-jack.koenvangilst.nl/assets/social-card.png">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Lumberjack: a Finnish cottage beside a lake under the northern lights.">

  <meta name="twitter:title" content="Lumberjack — A Finnish forest adventure">
  <meta name="twitter:description" content="One jack. One axe. An awful lot of trees. Play the free pixel-art forest strategy game.">
  <meta name="twitter:image" content="https://lumber-jack.koenvangilst.nl/assets/social-card.png">
  <meta name="twitter:image:alt" content="Lumberjack: a Finnish cottage beside a lake under the northern lights.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumberjack">
  <script defer data-domain="lumber-jack.koenvangilst.nl" data-api="https://plausible.koenvangilst.nl/api/event" src="https://plausible.koenvangilst.nl/js/script.js"></script>
  <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"VideoGame","name":"Lumberjack","url":"https://lumber-jack.koenvangilst.nl/","description":"A free pixel-art strategy game about building a logging village and exploring a Finnish forest.","image":"https://lumber-jack.koenvangilst.nl/assets/social-card.png","genre":["Strategy","Simulation"],"gamePlatform":"Web browser","operatingSystem":"Any","applicationCategory":"GameApplication","inLanguage":"en","playMode":"SinglePlayer","author":{"@type":"Person","name":"Koen van Gilst","url":"https://koenvangilst.nl/"},"offers":{"@type":"Offer","price":"0","priceCurrency":"EUR"}}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game">
    <canvas id="view"></canvas>
    <div id="overlay"></div>

    <header id="hud">
      <div class="logo"><span class="lumber">Lumber</span><span class="jack">Jack</span></div>
      <div class="chip" id="c-money" title="Money"><i data-ic="coin"></i><b>0</b></div>
      <div class="chip" id="c-wood" title="Wood in stock"><i data-ic="log"></i><b>0</b><button id="stockBtn" title="Sell wood at the market, or stockpile it at camp">Selling</button></div>
      <div class="chip" id="c-lumber" title="Lumber in stock"><i data-ic="plank"></i><b>0</b></div>
      <div class="chip" id="c-stone" title="Stone in stock"><i data-ic="stone"></i><b>0</b></div>
      <div class="chip" id="c-pop" title="Jacks"><i data-ic="jack"></i><b>1/4</b><span id="payTxt"></span></div>
      <div class="chip level" title="Trees cleared this level">
        <span class="badge" id="lvl">1</span>
        <div class="bar"><div id="lvlFill"></div><span id="lvlTxt"></span></div>
        <span id="quota"></span>
      </div>
      <div class="spacer"></div>
      <button class="hbtn" id="soundBtn" title="Sound">♪</button>
      <button class="hbtn" id="findsBtn" title="Forest finds and recipes" aria-label="Forest finds and recipes">✦</button>
      <button class="hbtn" id="helpBtn" title="How to play">?</button>
      <button class="hbtn" id="menuBtn" title="Menu (Esc)" aria-label="Menu">≡</button>
    </header>

    <div id="hint"></div>
    <div id="toast"></div>
    <div id="order"></div>
    <canvas id="mini" title="Minimap: click to jump there"></canvas>
    <div id="intro" class="wood" role="status" aria-live="polite"></div>
    <div id="cine"></div>
    <button id="again">Clear another piece of land</button>

    <div id="bottom">
      <div id="panel"></div>
      <div id="toolbar">
        <button data-act="stop" id="stopBtn" title="Stop the selected units (X)" aria-label="Stop">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="currentColor"/></svg></button>
        <button data-act="idle" id="idleBtn" title="Next idle jack (Tab)" aria-label="Next idle jack"><i data-ic="jack"></i><span id="idleN" class="count"></span></button>
        <span class="sep"></span>
        <button data-act="zoomout" title="Zoom out (−)" aria-label="Zoom out">
          <svg viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></button>
        <button data-act="zoomin" title="Zoom in (+)" aria-label="Zoom in">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></button>
        <button data-act="map" id="mapBtn" title="Map (M)" aria-label="Map">
          <svg viewBox="0 0 24 24"><path d="M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2zM9 4v14M15 6v14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg></button>
        <span class="sep"></span>
        <button data-act="shop" id="shopBtn" class="wide" title="Shop (B)">Shop<span id="shopDot"></span></button>
      </div>
    </div>

    <aside id="shop">
      <h2>Shop <button id="shopClose">✕</button></h2>
      <div id="shopList"></div>
    </aside>

    <div id="modal"></div>
    <div id="title">
      <canvas></canvas>
      <div class="tbox">
        <div class="logo"><span class="lumber">Lumber</span><span class="jack">Jack</span></div>
        <p class="tag">One jack. One axe. An awful lot of trees.</p>
        <div class="row"></div>
        <div class="site-actions">
          <button id="shareGame" class="ghost" type="button">Share game</button>
          <button id="installGame" class="ghost" type="button" hidden>Install game</button>
          <span id="shareStatus" role="status" aria-live="polite"></span>
        </div>
        <p class="place">Somewhere in Finland</p>
      </div>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/sfx-defs.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/lines.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/art.js"></script>
  <script src="js/sprites2.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
  <script src="js/discoveries.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ending.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/title.js"></script>
  <script src="js/save.js"></script>
  <script src="js/main.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
