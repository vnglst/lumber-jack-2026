<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumberjack — sprite sheet</title>
  <style>
    body { margin: 0; padding: 16px; background: #2a1c10; color: #ffe9b8; font: 600 13px ui-rounded, "Trebuchet MS", system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 14px; margin: 16px 0 8px; color: #f6c453; }
    p { margin: 0 0 8px; opacity: .85; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    figure { margin: 0; text-align: center; background: #4a9137; padding: 6px 8px 4px; border-radius: 6px; color: #fff; font-size: 11px; }
    canvas { image-rendering: pixelated; display: block; margin: 0 auto 3px; }
  </style>
</head>
<body>
  <h1>Lumberjack — sprite sheet</h1>
  <p>Every sprite is drawn in code (js/sprites.js, js/art.js, js/sprites2.js).</p>
  <div id="out"></div>
  <script src="js/util.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/art.js"></script>
  <script src="js/sprites2.js"></script>
  <script>
    const S = LJ.sprites, out = document.getElementById('out');
    function section(title, items) {
      const h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
      const row = document.createElement('div'); row.className = 'row'; out.appendChild(row);
      for (const [name, src] of items) {
        const k = src.width > 80 ? 2 : 3, c = document.createElement('canvas');
        c.width = src.width; c.height = src.height; c.getContext('2d').drawImage(src, 0, 0);
        c.style.width = src.width * k + 'px'; c.style.height = src.height * k + 'px';
        const f = document.createElement('figure'); f.appendChild(c); f.append(name); row.appendChild(f);
      }
    }
    const J = S.jack.axe, K = S.jack.saw, D = S.decor;
    section('Trees', [].concat(...S.trees.map((sp, i) => sp.map((c, v) => [['pine', 'oak', 'birch'][i] + ' ' + (v + 1), c]))));
    section('Jacks', [['idle', J.idle.r], ['walk 1', J.walk[0].r], ['walk 2', J.walk[1].r], ['axe up', J.chop[0].r], ['axe down', J.chop[1].r],
      ['carrying', J.carry[0].r], ['facing left', J.idle.l], ['chainsaw', K.chop[0].r], ['chainsaw 2', K.chop[1].r], ['laser pistol', S.jack.pistol[0].r], ['firing', S.jack.pistol[1].r]]);
    section('Rocks and stumps', S.rocks.map((c, i) => ['rock ' + (i + 1), c]).concat(S.pebbles.map((c, i) => ['pebbles ' + (i + 1), c]), S.stumps.map((c, i) => ['stump ' + (i + 1), c])));
    section('Plants', [].concat(...Object.keys(D).map(k => D[k].map((c, i) => [k + (D[k].length > 1 ? ' ' + (i + 1) : ''), c]))));
    section('Wildlife', [['deer', S.deer[0].r], ['deer walking', S.deer[1].r], ['squirrel', S.squirrel[0].r], ['squirrel hop', S.squirrel[1].r],
      ['forest folk', S.native[0].r], ['forest folk walking', S.native[1].r], ['forest folk aiming', S.nativeAim.r], ['hut', S.hut],
      ['wolf 1', S.wolf[0].r], ['wolf 2', S.wolf[1].r], ['bear 1', S.bear[0].r], ['bear 2', S.bear[1].r], ['gravestone', S.grave]]);
    section('Settlement: the tent and its upgrades', [['tent', S.camp], ['cabin', S.village], ['lodge', S.lodge], ['town hall', S.hall]]);
    section('Buildings', [['bunkhouse', S.bunk], ['sawmill', S.sawmill], ['log depot', S.depot], ['guard tower', S.tower], ['palisade', S.wall], ['palisade (damaged)', S.wallBroken], ['market sign', S.sign]]);
    section('Vehicles', [['truck', S.truck.empty.r], ['truck (loaded)', S.truck.full.r], ['bulldozer', S.dozer.r], ['harvester', S.harv.r], ['cement mixer', S.mixer.r]]);
    section('The ending', [['the man in the suit', S.suit.idle.r], ['walking', S.suit.walk[0].r], ['foundation', S.dcStage1], ['steel frame', S.dcStage2], ['AI data center', S.datacenter], ['crane', S.crane], ['module frame', S.dcFrame]].concat(S.dcBlocks.map((c, i) => ['module ' + (i + 1), c])));
    section('Icons', Object.entries(S.icons).filter(([, c]) => c.width <= 16));
  </script>
</body>
</html>
